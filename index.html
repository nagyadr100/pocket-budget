<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Budget</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">

<!--
  POCKET BUDGET
  A single-file budget tracker: HTML (structure) + CSS (looks) + JavaScript (behaviour).
  Data is saved in your browser with localStorage, so it never leaves your device
  and costs zero tokens to run.

  How to read this file:
  1. <style>  -> all the visual design. Colors live in "tokens" (CSS variables) at the top.
  2. <main>   -> the empty skeleton of the page. JavaScript fills it in.
  3. <script> -> the logic: state (your data), save/load, calculations, and render().
-->

<style>
  /* Layout: one narrow column, like a phone app. Summary first, then add, then detail. */
  :root {
    --bg: #f3f5f8;          /* page background, cool grey with a hint of blue */
    --surface: #ffffff;     /* cards and inputs */
    --fg: #16202c;          /* main text */
    --muted: #5d6b7c;       /* secondary text */
    --line: #dde3ea;        /* borders and empty bar tracks */
    --accent: #1f5fd1;      /* buttons, filled bars */
    --accent-ink: #ffffff;  /* text on accent */
    --good: #1d8a5a;
    --warn: #b7791f;
    --bad: #c2412d;
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
    --font-num: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f151d; --surface: #18212c; --fg: #e8edf3; --muted: #95a3b4; --line: #2a3644;
      --accent: #6b9bff; --accent-ink: #0b1220; --good: #4cc38a; --warn: #e3a948; --bad: #f07a63;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f151d; --surface: #18212c; --fg: #e8edf3; --muted: #95a3b4; --line: #2a3644;
    --accent: #6b9bff; --accent-ink: #0b1220; --good: #4cc38a; --warn: #e3a948; --bad: #f07a63;
    color-scheme: dark;
  }

  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
  .wrap {
    max-width: 560px; margin: 0 auto;
    padding-block: 20px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; gap: 20px;
  }
  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  h1, h2 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
  h1 { font-size: 1.6rem; letter-spacing: -0.01em; }
  h2 { font-size: 1.05rem; }
  .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }

  /* Header with month navigation */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .month-nav { display: flex; align-items: center; gap: 4px; }
  .month-nav span { min-width: 9.5em; text-align: center; font-weight: 600; }
  .icon-btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--fg);
    width: 34px; height: 34px; border-radius: 8px; font-size: 1rem; cursor: pointer;
  }

  /* Summary block: the one place with a strong card treatment */
  .summary { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; }
  .big { font-family: var(--font-display); font-size: 2.3rem; font-weight: 700; line-height: 1; }
  .big small { font-family: var(--font-body); font-size: 0.95rem; font-weight: 500; color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stats div { display: grid; gap: 2px; min-width: 0; }
  .stats .num { font-size: 0.95rem; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.82rem; font-weight: 600; }
  .pill.good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
  .pill.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }

  /* Bars (shared by summary and categories) */
  .bar { position: relative; height: 8px; background: var(--line); border-radius: 99px; overflow: visible; }
  .bar .fill { height: 100%; border-radius: 99px; background: var(--accent); max-width: 100%; }
  .bar .fill.warn { background: var(--warn); }
  .bar .fill.over { background: var(--bad); }
  .bar .today { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--fg); opacity: 0.45; border-radius: 1px; }

  /* Add-expense form */
  form { display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  input, select, textarea, button { font: inherit; }
  input, select, textarea {
    width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  }
  #amount { font-family: var(--font-num); font-size: 1.15rem; }
  .primary {
    border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600;
    padding: 12px; border-radius: 10px; cursor: pointer;
  }
  .error { color: var(--bad); font-size: 0.85rem; margin: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Category list */
  .section { display: grid; gap: 12px; }
  .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .cats { display: grid; gap: 14px; }
  .cat { display: grid; gap: 6px; }
  .cat-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .cat-name { font-weight: 600; min-width: 0; }
  .cat-money { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.9rem; white-space: nowrap; }
  .cat-money input { width: 5.5em; padding: 4px 8px; font-family: var(--font-num); font-size: 0.9rem; text-align: right; }
  .cat-money .spent { color: var(--fg); }
  .cat.over .spent { color: var(--bad); }

  /* Expense list */
  .list { list-style: none; margin: 0; padding: 0; display: grid; }
  .list li { display: grid; grid-template-columns: 3.2em 1fr auto auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .list .date { color: var(--muted); font-size: 0.8rem; }
  .list .what { min-width: 0; overflow-wrap: anywhere; }
  .list .what small { display: block; color: var(--muted); font-size: 0.8rem; }
  .del { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; padding: 4px 6px; border-radius: 6px; }
  .del:hover { color: var(--bad); }
  .tag { font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--warn); font-weight: 600; }
  .empty { color: var(--muted); padding: 12px 0; margin: 0; }

  /* Backup box */
  .hint { color: var(--muted); font-size: 0.88rem; margin: 0; }
  #backup-text { font-family: var(--font-num); font-size: 0.8rem; resize: vertical; }

  .banner { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px; border-radius: 10px; border: 1px dashed var(--warn); color: var(--fg); font-size: 0.88rem; }
  .ghost { border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 10px;
    display: flex; gap: 14px; align-items: center; font-size: 0.9rem; }
  .toast[hidden] { display: none; }   /* without this, "display: flex" above would keep it on screen */
  .toast button { background: none; border: 0; color: var(--bg); font-weight: 700; text-decoration: underline; cursor: pointer; }

  @media (max-width: 420px) { .big { font-size: 2rem; } .stats .num { font-size: 0.85rem; } }
  @media (prefers-reduced-motion: no-preference) { .bar .fill { transition: width 0.3s ease; } }
</style>

<main class="wrap">
  <header>
    <h1>Pocket Budget</h1>
    <div class="month-nav">
      <button class="icon-btn" id="prev" aria-label="Previous month">‹</button>
      <span id="month-label"></span>
      <button class="icon-btn" id="next" aria-label="Next month">›</button>
    </div>
  </header>

  <div id="banner"></div>
  <section class="summary" id="summary" aria-label="Month summary"></section>

  <section class="section">
    <h2>Add expense</h2>
    <form id="add-form" novalidate>
      <input id="amount" inputmode="decimal" placeholder="0,00 €" aria-label="Amount in euros" autocomplete="off">
      <div class="row">
        <select id="category" aria-label="Category"></select>
        <input id="date" type="date" aria-label="Date">
      </div>
      <input id="note" placeholder="Note (optional), e.g. Mercadona" aria-label="Note" autocomplete="off">
      <p class="error" id="form-error" hidden></p>
      <button class="primary" type="submit">Add expense</button>
    </form>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>Categories</h2>
      <span class="label">Spent / monthly limit</span>
    </div>
    <div class="cats" id="cats"></div>
  </section>

  <section class="section">
    <h2>Expenses this month</h2>
    <ul class="list" id="list"></ul>
  </section>

  <section class="section">
    <h2>Backup</h2>
    <p class="hint">Tap "Copy my data" and paste the text somewhere safe, like Notes or an email to yourself. To restore, paste a backup into the box and tap "Restore".</p>
    <textarea id="backup-text" rows="5" placeholder="Your backup text appears here, or paste one in" aria-label="Backup text" spellcheck="false"></textarea>
    <p class="error" id="backup-error" hidden></p>
    <div class="row">
      <button class="ghost" type="button" id="copy-btn">Copy my data</button>
      <button class="ghost" type="button" id="import-btn">Restore</button>
    </div>
  </section>
</main>

<div class="toast" id="toast" hidden></div>

<script>
// ---------------------------------------------------------------------------
// 1. SETTINGS: categories and their default monthly limits (in euros).
//    Edit this list to change your categories.
// ---------------------------------------------------------------------------
const CATEGORIES = [
  { id: "rent",      name: "Rent & bills",    limit: 700 },
  { id: "groceries", name: "Groceries",       limit: 250 },
  { id: "eating",    name: "Eating out",      limit: 120 },
  { id: "transport", name: "Transport",       limit: 40  },
  { id: "subs",      name: "Subscriptions",   limit: 30  },
  { id: "fun",       name: "Fun & going out", limit: 100 },
  { id: "other",     name: "Other",           limit: 60  },
];

const STORAGE_KEY = "pocket-budget-v1";
const eur = new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" });

// ---------------------------------------------------------------------------
// 2. DATE HELPERS: dates are stored as text like "2026-10-22".
// ---------------------------------------------------------------------------
const pad = n => String(n).padStart(2, "0");
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => toISO(new Date());
const monthOf = iso => iso.slice(0, 7);                         // "2026-10-22" -> "2026-10"
const daysInMonth = ym => { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); };
function shiftMonth(ym, delta) {
  const [y, m] = ym.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
}

// ---------------------------------------------------------------------------
// 3. STATE: all your data lives in this one object.
//    save() writes it to localStorage; load() reads it back.
//    try/catch is there because some browsers block storage (private mode).
// ---------------------------------------------------------------------------
function load() {
  try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }
  catch (e) { return null; }
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ budgets: state.budgets, expenses: state.expenses })); }
  catch (e) { /* storage unavailable: the app still works, it just won't remember */ }
}

// BACKUP: turn your data into text you can copy...
function exportText() {
  return JSON.stringify({ budgets: state.budgets, expenses: state.expenses }, null, 2);
}

// ...and turn pasted text back into data. Returns null if the text isn't a valid backup.
// Broken expenses are skipped (and counted) instead of breaking the whole restore.
function readBackup(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { return null; }       // not valid JSON text
  if (!data || !Array.isArray(data.expenses) || typeof data.budgets !== "object" || data.budgets === null) return null;

  // Limits: use the backup's value if it's a valid number, otherwise the default limit.
  const budgets = {};
  CATEGORIES.forEach(c => {
    const v = Number(data.budgets[c.id]);
    budgets[c.id] = v >= 0 ? Math.round(v * 100) / 100 : c.limit;
  });

  // Expenses: keep only rows with a real date, a category and an amount above zero.
  const expenses = [];
  let skipped = 0;
  data.expenses.forEach((e, i) => {
    const amount = Number(e?.amount);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(e?.date) || typeof e.cat !== "string" || !(amount > 0)) { skipped++; return; }
    const row = { id: String(e.id ?? "imp" + i), date: e.date, cat: e.cat, amount: Math.round(amount * 100) / 100, note: String(e.note ?? "") };
    if (e.example) row.example = true;
    expenses.push(row);
  });
  return { budgets, expenses, skipped };
}

// First visit: fill in example expenses so you can see how it works.
function exampleExpenses() {
  const ym = monthOf(todayISO());
  const rows = [
    [1, "rent", 700, "Room + bills"], [3, "groceries", 46.8, "Mercadona"], [4, "subs", 10.99, "Spotify"],
    [6, "transport", 22.0, "T-usual card"], [8, "eating", 18.5, "Lunch with team"], [10, "groceries", 38.2, "Lidl"],
    [12, "fun", 35.0, "Concert ticket"], [15, "eating", 27.0, "Dinner, Gràcia"], [17, "groceries", 52.4, "Mercadona"],
    [19, "other", 14.95, "Phone case"], [20, "eating", 9.8, "Coffee + pastry x3"],
  ];
  const max = Number(todayISO().slice(8, 10));
  return rows
    .filter(r => r[0] <= max)                       // no examples dated in the future
    .map((r, i) => ({ id: "ex" + i, date: `${ym}-${pad(r[0])}`, cat: r[1], amount: r[2], note: r[3], example: true }));
}

const saved = load();
const state = {
  budgets: saved?.budgets ?? Object.fromEntries(CATEGORIES.map(c => [c.id, c.limit])),
  expenses: saved?.expenses ?? exampleExpenses(),
  viewMonth: monthOf(todayISO()),                  // which month is on screen (not saved)
};

// ---------------------------------------------------------------------------
// 4. RENDER: rebuild the screen from the state. Called after every change.
//    This "state -> render" pattern is the core idea behind React and most apps.
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

function render() {
  const ym = state.viewMonth;
  const [y, m] = ym.split("-").map(Number);
  $("month-label").textContent = new Date(y, m - 1, 1).toLocaleDateString("en-GB", { month: "long", year: "numeric" });

  const monthItems = state.expenses.filter(e => monthOf(e.date) === ym);
  const spentByCat = {};
  monthItems.forEach(e => { spentByCat[e.cat] = (spentByCat[e.cat] || 0) + e.amount; });

  const totalBudget = CATEGORIES.reduce((sum, c) => sum + (Number(state.budgets[c.id]) || 0), 0);
  const totalSpent = monthItems.reduce((sum, e) => sum + e.amount, 0);
  const remaining = totalBudget - totalSpent;

  // Pacing: how far through the month are we? (Only meaningful for the current month.)
  const isCurrent = ym === monthOf(todayISO());
  const dim = daysInMonth(ym);
  const day = isCurrent ? Number(todayISO().slice(8, 10)) : null;
  const elapsed = isCurrent ? day / dim : null;

  // --- Summary card ---
  let paceHTML = "";
  if (isCurrent && totalBudget > 0) {
    const expected = totalBudget * elapsed;
    const diff = totalSpent - expected;
    paceHTML = diff <= 0
      ? `<span class="pill good">On pace · ${eur.format(-diff)} under</span>`
      : `<span class="pill bad">Ahead of pace · ${eur.format(diff)} over</span>`;
  }
  const pct = totalBudget ? totalSpent / totalBudget : 0;
  $("summary").innerHTML = `
    <div class="label">${isCurrent ? `Day ${day} of ${dim}` : "Month total"}</div>
    <div class="big num">${eur.format(totalSpent)} <small>of ${eur.format(totalBudget)}</small></div>
    ${bar(pct, elapsed)}
    <div class="stats">
      <div><span class="label">Left</span><span class="num" style="color:${remaining < 0 ? "var(--bad)" : "inherit"}">${eur.format(remaining)}</span></div>
      <div><span class="label">Per day left</span><span class="num">${isCurrent && remaining > 0 ? eur.format(remaining / (dim - day + 1)) : "–"}</span></div>
      <div><span class="label">Expenses</span><span class="num">${monthItems.length}</span></div>
    </div>
    ${paceHTML ? `<div>${paceHTML}</div>` : ""}`;

  // --- Categories ---
  $("cats").innerHTML = CATEGORIES.map(c => {
    const limit = Number(state.budgets[c.id]) || 0;
    const spent = spentByCat[c.id] || 0;
    const p = limit ? spent / limit : (spent > 0 ? 1.01 : 0);
    return `
      <div class="cat ${p > 1 ? "over" : ""}">
        <div class="cat-top">
          <span class="cat-name">${c.name}</span>
          <span class="cat-money"><span class="num spent">${eur.format(spent)}</span> /
            <input class="limit" data-cat="${c.id}" id="limit-${c.id}" inputmode="decimal" value="${limit}" aria-label="${c.name} monthly limit"> €</span>
        </div>
        ${bar(p, elapsed)}
      </div>`;
  }).join("");

  // --- Expense list (newest first) ---
  const sorted = [...monthItems].sort((a, b) => b.date.localeCompare(a.date) || String(b.id).localeCompare(String(a.id)));
  const catName = id => CATEGORIES.find(c => c.id === id)?.name ?? id;
  $("list").innerHTML = sorted.length ? sorted.map(e => `
    <li>
      <span class="date num">${e.date.slice(8)}/${e.date.slice(5, 7)}</span>
      <span class="what">${esc(e.note || catName(e.cat))}<small>${catName(e.cat)}${e.example ? ' · <span class="tag">Example</span>' : ""}</small></span>
      <span class="num">${eur.format(e.amount)}</span>
      <button class="del" data-del="${e.id}" aria-label="Delete expense">×</button>
    </li>`).join("") : `<p class="empty">Nothing logged this month yet. Add your first expense above.</p>`;

  // --- Example data banner ---
  const hasExamples = state.expenses.some(e => e.example);
  $("banner").innerHTML = hasExamples
    ? `<div class="banner"><span>These are example expenses so you can see how it works.</span><button class="ghost" id="clear-ex">Clear examples</button></div>`
    : "";
}

// A progress bar. "today" draws a small tick showing how much of the month has passed.
function bar(p, today) {
  const cls = p > 1 ? "over" : p > 0.85 ? "warn" : "";
  const tick = today != null ? `<span class="today" style="left:calc(${(today * 100).toFixed(1)}% - 1px)"></span>` : "";
  return `<div class="bar"><div class="fill ${cls}" style="width:${Math.min(p, 1) * 100}%"></div>${tick}</div>`;
}

// ---------------------------------------------------------------------------
// 5. EVENTS: what happens when you tap or type.
// ---------------------------------------------------------------------------
$("category").innerHTML = CATEGORIES.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
$("date").value = todayISO();

$("add-form").addEventListener("submit", ev => {
  ev.preventDefault();                                             // stop the page from reloading
  const amount = parseFloat($("amount").value.replace(",", "."));  // accept "12,50" and "12.50"
  if (!(amount > 0)) {
    $("form-error").textContent = "Enter an amount above zero, like 12,50.";
    $("form-error").hidden = false;
    return;
  }
  $("form-error").hidden = true;
  const date = $("date").value || todayISO();
  state.expenses.push({ id: Date.now().toString(36), date, cat: $("category").value, amount: Math.round(amount * 100) / 100, note: $("note").value.trim() });
  state.viewMonth = monthOf(date);                                 // jump to the month you just added to
  save(); render();
  $("amount").value = ""; $("note").value = "";
  showToast(`Added ${eur.format(amount)}`);
});

// Event delegation: one listener on the page handles buttons that render() creates later.
document.addEventListener("click", ev => {
  const del = ev.target.closest("[data-del]");
  if (del) {
    const idx = state.expenses.findIndex(e => e.id === del.dataset.del);
    if (idx > -1) {
      const [removed] = state.expenses.splice(idx, 1);
      save(); render();
      showToast("Expense deleted", () => { state.expenses.push(removed); save(); render(); });
    }
  }
  if (ev.target.id === "clear-ex") {
    state.expenses = state.expenses.filter(e => !e.example);
    save(); render();
  }
});

document.addEventListener("change", ev => {
  if (ev.target.classList.contains("limit")) {
    const v = parseFloat(ev.target.value.replace(",", "."));
    state.budgets[ev.target.dataset.cat] = v >= 0 ? v : 0;
    save(); render();
  }
});

// Backup: copy all data as text.
$("copy-btn").addEventListener("click", async () => {
  const box = $("backup-text");
  box.value = exportText();
  $("backup-error").hidden = true;
  try {
    await navigator.clipboard.writeText(box.value);                // ask the browser to copy
    showToast("Copied! Paste it somewhere safe.");
  } catch (e) {
    box.select();                                                  // copying blocked: select the text instead
    showToast("Text selected. Copy it from the box.");
  }
});

// Backup: restore from pasted text. Replaces everything, so it asks first.
$("import-btn").addEventListener("click", () => {
  const backup = readBackup($("backup-text").value);
  if (!backup) {
    $("backup-error").textContent = "That doesn't look like a Pocket Budget backup. Nothing was changed.";
    $("backup-error").hidden = false;
    return;
  }
  $("backup-error").hidden = true;
  const ok = confirm(`Replace your ${state.expenses.length} current expenses and your limits with the ${backup.expenses.length} expenses in this backup?`);
  if (!ok) return;
  const before = { budgets: state.budgets, expenses: state.expenses };  // kept for Undo
  state.budgets = backup.budgets;
  state.expenses = backup.expenses;
  save(); render();
  $("backup-text").value = "";
  const note = backup.skipped ? ` (${backup.skipped} broken skipped)` : "";
  showToast(`Restored ${backup.expenses.length} expenses${note}`, () => { state.budgets = before.budgets; state.expenses = before.expenses; save(); render(); });
});

$("prev").addEventListener("click", () => { state.viewMonth = shiftMonth(state.viewMonth, -1); render(); });
$("next").addEventListener("click", () => { state.viewMonth = shiftMonth(state.viewMonth, 1); render(); });

// Small message at the bottom, with an optional Undo button.
let toastTimer;
function showToast(text, undo) {
  const t = $("toast");
  t.innerHTML = `<span>${text}</span>${undo ? '<button type="button" id="undo">Undo</button>' : ""}`;
  t.hidden = false;
  if (undo) $("undo").onclick = () => { undo(); t.hidden = true; };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 4000);
}

render();
</script>
